<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폰트저울</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- UI 서체 (공통) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<!-- 디자인 토큰은 app/tokens.css에서만 정의 -->
<link rel="stylesheet" href="../app/tokens.css">
<!-- 헤더·탭·제목 영역 공통 스타일 -->
<link rel="stylesheet" href="../app/shell.css">
<style>
  h2 { margin: 0 0 var(--space-3); font-size: var(--text-heading-size); font-weight: var(--text-heading-weight); line-height: var(--text-heading-lh); }

  /* 입력 */
  label, .label { display: block; margin-bottom: var(--space-1); color: var(--color-text-sub); font-size: var(--text-caption-size); line-height: var(--text-caption-lh); }
  .field { min-width: 0; }
  input[type="text"], select {
    width: 100%; height: 40px; padding: 0 var(--space-3);
    background: var(--color-surface); border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm);
  }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--color-accent); }
  .samples { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
  .controls { display: grid; grid-template-columns: 1fr 2fr 2fr; gap: var(--space-5); margin-top: var(--space-4); }
  @media (max-width: 760px) { .controls { grid-template-columns: 1fr; gap: var(--space-4); } }

  .btn {
    height: 36px; padding: 0 var(--space-4); background: var(--color-bg);
    border: 1px solid var(--color-border-strong); border-radius: var(--radius-sm); cursor: pointer;
  }
  .btn:hover { background: var(--color-surface); }
  .btn:active { background: var(--color-border); }
  .btn-icon { width: 36px; padding: 0; }
  .btn-text { border-color: transparent; background: none; color: var(--color-text-sub); }

  /* 슬라이더 */
  .slider { display: flex; align-items: center; gap: var(--space-3); height: 40px; }
  .slider input { flex: 1; accent-color: var(--color-accent); }
  .slider output { min-width: 4.5em; text-align: right; font-variant-numeric: tabular-nums; }

  /* 비교 카드 */
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); margin-top: var(--space-5); }
  @media (max-width: 900px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md);
    padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); min-height: 260px;
  }
  .card-head { display: flex; gap: var(--space-2); align-items: flex-end; }
  .card-head .field { flex: 1; }
  .star { color: var(--color-text-sub); font-size: 20px; line-height: 1; }
  .star[aria-pressed="true"] { color: var(--color-accent); }
  .sample { flex: 1; overflow-wrap: anywhere; line-height: 1.4; min-height: 3em; }
  .skeleton { flex: 1; min-height: 80px; background: var(--color-surface); border-radius: var(--radius-sm); }
  .note { margin: 0; font-size: var(--text-caption-size); line-height: var(--text-caption-lh); color: var(--color-text-muted); }
  .error { color: var(--color-danger); }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); text-align: center; color: var(--color-text-sub); }

  /* 저장 목록 */
  .saved { margin-top: var(--space-5); padding-top: var(--space-5); border-top: 1px solid var(--color-border); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .saved .note { font-size: var(--text-body-size); color: var(--color-text-muted); }
</style>
</head>
<body>
<main class="wrap">
  <h1>폰트저울</h1>
  <p class="intro">한글 서체를 저울에 올리듯, 같은 문장으로 나란히 견줘보세요.</p>

  <section aria-label="비교 조건">
    <div class="field">
      <label for="text">비교할 문장</label>
      <input type="text" id="text" autocomplete="off" placeholder="비교할 문장을 입력하세요">
      <div class="samples" role="group" aria-label="샘플 문장">
        <button class="btn" data-sample="오늘의 추천 코스를 확인해 보세요">제목용</button>
        <button class="btn" data-sample="다람쥐 헌 쳇바퀴에 타고파. 키스의 고유조건은 입술끼리 만나야 하고 특별한 기술은 필요치 않다.">본문용</button>
        <button class="btn" data-sample="다람쥐 헌 쳇바퀴에 타고파 1234567890">숫자 포함</button>
      </div>
    </div>
    <div class="controls">
      <div class="field">
        <label for="weight">굵기</label>
        <select id="weight"></select>
      </div>
      <div class="field">
        <label for="size">크기</label>
        <div class="slider"><input type="range" id="size" min="12" max="96" step="1"><output for="size" id="sizeOut"></output></div>
      </div>
      <div class="field">
        <label for="track">자간</label>
        <div class="slider"><input type="range" id="track" min="-5" max="10" step="1"><output for="track" id="trackOut"></output></div>
      </div>
    </div>
  </section>

  <section class="cards" id="cards" aria-label="후보 폰트 비교"></section>

  <section class="saved" aria-label="저장한 폰트">
    <h2>저장한 폰트</h2>
    <div id="saved"></div>
  </section>
</main>

<script>
/* [가정] API 키 없이 쓰는 고정 후보 목록. 굵기 정보는 확인 전 값이라 실제 로딩 결과로 점검 필요 */
const FONTS = [
  { name: 'Noto Sans KR',     weights: [100,200,300,400,500,600,700,800,900] },
  { name: 'Noto Serif KR',    weights: [200,300,400,500,600,700,800,900] },
  { name: 'Gothic A1',        weights: [100,200,300,400,500,600,700,800,900] },
  { name: 'IBM Plex Sans KR', weights: [100,200,300,400,500,600,700] },
  { name: 'Nanum Gothic',     weights: [400,700,800] },
  { name: 'Nanum Myeongjo',   weights: [400,700,800] },
  { name: 'Gowun Batang',     weights: [400,700] },
  { name: 'Black Han Sans',   weights: [400] },
];
const WEIGHT_LABEL = {100:'Thin',200:'ExtraLight',300:'Light',400:'Regular',500:'Medium',600:'SemiBold',700:'Bold',800:'ExtraBold',900:'Black'};
const DEFAULTS = { text: '다람쥐 헌 쳇바퀴에 타고파 1234', weight: 400, size: 32, track: 0, slots: ['Noto Sans KR','Noto Serif KR','Nanum Gothic'], saved: [] };

/* 상태: localStorage에 보관 (막혀 있어도 화면은 동작) */
const KEY = 'fontscale.v1';
let state;
try { state = { ...DEFAULTS, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch { state = { ...DEFAULTS }; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const $ = (id) => document.getElementById(id);
const byName = (n) => FONTS.find(f => f.name === n);
const loadStatus = {}; // 'loading' | 'ok' | 'fail' (같은 폰트는 한 번만 요청)

function nearest(weights, w) { return weights.reduce((a, b) => Math.abs(b - w) < Math.abs(a - w) ? b : a); }

function loadFont(name) {
  if (loadStatus[name]) return;
  loadStatus[name] = 'loading';
  const f = byName(name);
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = `https://fonts.googleapis.com/css2?family=${name.replace(/ /g, '+')}:wght@${f.weights.join(';')}&display=swap`;
  link.onerror = () => { loadStatus[name] = 'fail'; renderCards(); };
  link.onload = () => {
    // 글꼴 파일까지 실제로 받았는지 확인
    document.fonts.load(`${f.weights[0]} 16px "${name}"`, '가').then(
      (r) => { loadStatus[name] = r.length ? 'ok' : 'fail'; renderCards(); },
      () => { loadStatus[name] = 'fail'; renderCards(); });
  };
  document.head.appendChild(link);
}

function fontOptions(selected) {
  return `<option value="">폰트 선택</option>` +
    FONTS.map(f => `<option value="${f.name}"${f.name === selected ? ' selected' : ''}>${f.name}</option>`).join('');
}

function renderCards() {
  const wrap = $('cards');
  // 선택 창이 열려 있을 때 다시 그려지지 않도록 카드 내용만 갱신
  state.slots.forEach((name, i) => {
    let card = wrap.children[i];
    if (!card) {
      card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <div class="field"><label for="slot${i}">후보 ${String.fromCharCode(65 + i)}</label><select id="slot${i}">${fontOptions(name)}</select></div>
          <button class="btn btn-icon star" aria-label="저장" aria-pressed="false">☆</button>
        </div>
        <div class="body"></div>`;
      card.querySelector('select').onchange = (e) => { state.slots[i] = e.target.value || null; save(); if (e.target.value) loadFont(e.target.value); renderCards(); renderSaved(); };
      card.querySelector('.star').onclick = () => toggleSaved(state.slots[i]);
      wrap.appendChild(card);
    }
    const f = name && byName(name);
    const star = card.querySelector('.star');
    const on = !!name && state.saved.includes(name);
    star.textContent = on ? '★' : '☆';
    star.setAttribute('aria-pressed', on);
    star.setAttribute('aria-label', on ? `${name} 저장 해제` : `${name} 저장`);
    star.disabled = !name; star.style.opacity = name ? 1 : .4;
    card.querySelector('select').value = name || '';

    const body = card.querySelector('.body');
    body.style.display = 'contents';
    if (!f) {
      body.innerHTML = `<div class="empty"><span>폰트를 검색해서 추가해 보세요</span><button class="btn">폰트 추가</button></div>`;
      body.querySelector('button').onclick = () => card.querySelector('select').focus();
      return;
    }
    const st = loadStatus[name];
    if (st === 'fail') {
      body.innerHTML = `<p class="note error">폰트를 불러오지 못했어요</p><div><button class="btn">다시 시도</button></div>`;
      body.querySelector('button').onclick = () => { delete loadStatus[name]; document.querySelectorAll(`link[href*="${name.replace(/ /g,'+')}"]`).forEach(l => l.remove()); loadFont(name); renderCards(); };
      return;
    }
    if (st !== 'ok') { body.innerHTML = `<div class="skeleton" aria-busy="true"></div>`; return; }
    const w = nearest(f.weights, state.weight);
    const sample = document.createElement('div');
    sample.className = 'sample';
    sample.textContent = state.text || ' ';
    sample.style.cssText = `font-family:"${name}",sans-serif;font-weight:${w};font-size:${state.size}px;letter-spacing:${state.track / 100}em`;
    body.replaceChildren(sample);
    if (w !== state.weight) {
      const n = document.createElement('p');
      n.className = 'note';
      n.textContent = `${WEIGHT_LABEL[state.weight]}을 지원하지 않아 ${WEIGHT_LABEL[w]}(${w})로 보여줘요`;
      body.appendChild(n);
    }
  });
}

function toggleSaved(name) {
  if (!name) return;
  state.saved = state.saved.includes(name) ? state.saved.filter(n => n !== name) : [...state.saved, name];
  save(); renderCards(); renderSaved();
}

function renderSaved() {
  const box = $('saved');
  if (!state.saved.length) { box.innerHTML = `<p class="note">☆를 눌러 마음에 드는 폰트를 저장해 보세요</p>`; return; }
  box.innerHTML = '<div class="chips"></div>';
  state.saved.forEach(name => {
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = name;
    b.title = '빈 비교 칸에 채우기';
    b.onclick = () => {
      if (state.slots.includes(name)) return;
      const i = state.slots.findIndex(s => !s);
      if (i < 0) return; // 빈 칸이 없으면 변경하지 않음
      state.slots[i] = name; save(); loadFont(name); renderCards();
    };
    box.firstChild.appendChild(b);
  });
}

function renderControls() {
  $('sizeOut').textContent = `${state.size}px`;
  $('trackOut').textContent = `${state.track > 0 ? '+' : ''}${state.track}%`;
}

/* 초기화 */
$('weight').innerHTML = [100,200,300,400,500,600,700,800,900].map(w => `<option value="${w}">${WEIGHT_LABEL[w]} (${w})</option>`).join('');
$('text').value = state.text; $('weight').value = state.weight; $('size').value = state.size; $('track').value = state.track;

$('text').oninput = (e) => { state.text = e.target.value; save(); renderCards(); };
$('weight').onchange = (e) => { state.weight = +e.target.value; save(); renderCards(); };
$('size').oninput = (e) => { state.size = +e.target.value; save(); renderControls(); renderCards(); };
$('track').oninput = (e) => { state.track = +e.target.value; save(); renderControls(); renderCards(); };
document.querySelectorAll('[data-sample]').forEach(b => b.onclick = () => { state.text = b.dataset.sample; $('text').value = state.text; save(); renderCards(); });

// 저장된 값에 이전 목록에 없는 폰트가 있으면 비움
state.slots = (state.slots.length ? state.slots : DEFAULTS.slots).slice(0, 3).map(n => byName(n) ? n : null);
while (state.slots.length < 3) state.slots.push(null);
state.saved = state.saved.filter(byName);
state.slots.forEach(n => n && loadFont(n));
renderControls(); renderCards(); renderSaved();
</script>
</body>
</html>
