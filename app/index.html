<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자이너 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- UI 서체 (공통) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<!-- 디자인 토큰은 app/tokens.css에서만 정의 -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<style>
  /* 서비스 화면 영역: 헤더 아래를 채운다. 한 번 연 서비스는 숨기기만 해서 입력값이 유지된다 */
  .panel { width: 100%; height: calc(100vh - var(--header-height) - 1px); border: 0; }
  iframe.panel:not([hidden]) { display: block; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">디자이너 도구</div>
    <nav id="tabs" role="tablist" aria-label="서비스"></nav>
  </div>
</header>
<div id="panels"></div>

<script>
// 탭 목록(이름과 경로)은 여기 한 곳에서만 정한다. 첫 항목이 기본 탭.
// [가정] 경로는 별도 HTML 기준 상대 경로. 게시 구조가 정해지면 이 목록만 고친다.
const SERVICES = [
  { id: 'font',          name: '폰트저울',    src: '../font/index.html' },
  { id: 'moodboard',     name: '무드보드',    src: '../moodboard/index.html' },
  { id: 'color-palette', name: '컬러 팔레트', src: '../color-palette/index.html' },
];

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

SERVICES.forEach(s => {
  const tab = document.createElement('button');
  tab.className = 'tab';
  tab.id = `tab-${s.id}`;
  tab.setAttribute('role', 'tab');
  tab.setAttribute('aria-controls', `panel-${s.id}`);
  tab.textContent = s.name;
  tab.onclick = () => { location.hash = s.id; };
  tab.onkeydown = (e) => {
    const i = SERVICES.indexOf(s);
    const next = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : null;
    if (next === null) return;
    e.preventDefault();
    const target = SERVICES[(next + SERVICES.length) % SERVICES.length];
    location.hash = target.id;
    document.getElementById(`tab-${target.id}`).focus();
  };
  tabsEl.appendChild(tab);

  const panel = document.createElement('iframe');
  panel.className = 'panel';
  panel.id = `panel-${s.id}`;
  panel.title = s.name;
  panel.setAttribute('role', 'tabpanel');
  panel.setAttribute('aria-labelledby', `tab-${s.id}`);
  panel.hidden = true;
  panelsEl.appendChild(panel);
});

function show() {
  const current = SERVICES.find(s => s.id === location.hash.slice(1)) || SERVICES[0];
  SERVICES.forEach(s => {
    const on = s === current;
    const tab = document.getElementById(`tab-${s.id}`);
    const panel = document.getElementById(`panel-${s.id}`);
    tab.setAttribute('aria-selected', on);
    tab.tabIndex = on ? 0 : -1;
    panel.hidden = !on;
    if (on && !panel.getAttribute('src')) panel.src = s.src; // 처음 열 때만 불러옴
  });
  document.title = `${current.name} · 디자이너 도구`;
}

addEventListener('hashchange', show);
show();
</script>
</body>
</html>
